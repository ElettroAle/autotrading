[project]
name = "autotrading"
version = "0.0.0"
description = "Piattaforma personale di trading automatico multi-tenant"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.16",
    "eth-account>=0.10,<0.11",
    "fastapi>=0.120",
    "httpx>=0.28",
    "hyperliquid-python-sdk>=0.24.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.0",
    "openai>=3.50,<4",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "pynacl>=1.6.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "gherkin-official>=36",
    "git-cliff>=2.10",
    "import-linter>=2.5",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-bdd>=8.1",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]
forecaster = [
    "fastapi>=0.120",
    "prophet>=1.5",
    "uvicorn>=0.38",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not wip and not pipeline and not integration and not testnet and not providers and not sources"]
testpaths = ["tests"]
pythonpath = ["."]
bdd_features_base_dir = "specs"
markers = [
    "wip: User Story non ancora consegnata, esclusa finché il tag resta nel .feature",
    "pipeline: scenario provato da un'esecuzione reale della pipeline, non da pytest",
    "integration: adapter contro la tecnologia vera",
    "testnet: adapter Hyperliquid contro la testnet",
    "providers: verifica delle chiavi contro i fornitori IA veri, con una chiave inventata",
    "sources: adapter delle fonti contro i servizi pubblici veri",
]

[tool.coverage.run]
source = ["src/autotrading", "tools", "forecaster"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["src", "tests", "tools", "forecaster"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "RET", "ARG", "PT", "TRY", "EM", "S", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["autotrading", "tools", "tests", "forecaster"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src", "tests", "tools", "forecaster"]
mypy_path = ["src", "."]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pytest_bdd.*", "hyperliquid.*", "pandas.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "autotrading"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Le dipendenze puntano solo verso il centro"
type = "layers"
layers = [
    "autotrading.bootstrap",
    "autotrading.adapters",
    "autotrading.application",
    "autotrading.domain",
]

[[tool.importlinter.contracts]]
name = "Domain e application non importano tecnologie"
type = "forbidden"
source_modules = ["autotrading.domain", "autotrading.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "jwt",
    "nacl",
    "hyperliquid",
    "eth_account",
    "requests",
    "httpx",
    "langgraph",
    "openai",
]
# The owner's named architectural exception (ADR 0104): LangGraph orchestrates the decision cycle, only here.
ignore_imports = ["autotrading.application.flows.cycle_graph -> langgraph"]

[[tool.importlinter.contracts]]
name = "I contesti di domain non si importano a vicenda (tenancy esclusa)"
type = "independence"
modules = [
    "autotrading.domain.accounts",
    "autotrading.domain.orders",
    "autotrading.domain.verification",
    "autotrading.domain.flows",
    "autotrading.domain.sources",
    "autotrading.domain.agent",
    "autotrading.domain.notifications",
]

[[tool.importlinter.contracts]]
name = "I contesti di application non si importano a vicenda (tenancy esclusa)"
type = "independence"
modules = [
    "autotrading.application.accounts",
    "autotrading.application.orders",
    "autotrading.application.verification",
    "autotrading.application.flows",
    "autotrading.application.sources",
    "autotrading.application.agent",
    "autotrading.application.notifications",
]

[[tool.importlinter.contracts]]
name = "La sorgente della configurazione non importa le cartelle di tecnologia"
type = "forbidden"
source_modules = ["autotrading.adapters.configuration"]
forbidden_modules = ["autotrading.adapters.inbound", "autotrading.adapters.outbound", "autotrading.application"]

[[tool.importlinter.contracts]]
name = "Una cartella di tecnologia non importa un'altra"
type = "independence"
modules = [
    "autotrading.adapters.inbound.api",
    "autotrading.adapters.outbound.sqlalchemy",
    "autotrading.adapters.outbound.libsodium",
    "autotrading.adapters.outbound.hyperliquid",
    "autotrading.adapters.outbound.alternative_me",
    "autotrading.adapters.outbound.coinmarketcap",
    "autotrading.adapters.outbound.rss",
    "autotrading.adapters.outbound.telegram",
    "autotrading.adapters.outbound.worker",
    "autotrading.adapters.outbound.json",
    "autotrading.adapters.outbound.litellm",
    "autotrading.adapters.outbound.oidc",
    "autotrading.adapters.outbound.system_clock",
    "autotrading.adapters.outbound.threads",
]

[tool.uv]
override-dependencies = [
    # Without a wheel for Python 3.15; only the tracing of langsmith uses it, never enabled (ADR 0104).
    "zstandard; sys_platform == 'never'",
]
