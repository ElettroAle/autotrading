# Installazione dev o prod. I valori arrivano dal file .env scritto dalla pipeline
# (nessun segreto): immagine per digest, ambiente, versione.
# L'API ascolta solo sull'interfaccia locale: la espone Tailscale Serve, in HTTPS e solo nel tailnet (ADR 0013).
name: autotrading

services:
  api:
    image: ${API_IMAGE:-}
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-}
      APP_VERSION: ${APP_VERSION:-}
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
