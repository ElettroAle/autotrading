# Installazione dev o prod. I valori arrivano dal file .env scritto dalla pipeline
# (nessun segreto): immagine per digest, ambiente, versione.
# L'API ascolta solo sull'interfaccia locale: la espone Tailscale Serve, in HTTPS e solo nel tailnet (ADR 0013).
# I segreti dei servizi sono file generati sulla macchina da prepare-installation.sh e montati in sola
# lettura; mai variabili d'ambiente (ADR 0015).
name: autotrading

services:
  postgres:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: autotrading
      POSTGRES_USER: autotrading_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
      - postgres_app_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "autotrading_owner", "--dbname", "autotrading"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Applica le migrazioni come proprietario del database, poi termina; l'API parte solo se sono riuscite.
  migrate:
    image: ${API_IMAGE:-}
    entrypoint: ["/app/.venv/bin/python", "-m", "alembic", "-c", "/app/migrations/alembic.ini"]
    command: ["upgrade", "head"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: autotrading
      DATABASE_OWNER: autotrading_owner
      DATABASE_OWNER_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Gateway verso i modelli IA (ADR 0101): solo sulla rete dell'installazione, nessuna porta pubblicata. La
  # configurazione, con la chiave master, è un file generato sulla macchina; nessuna chiave dei fornitori: la chiave
  # dell'utente arriva con ogni richiesta del worker (RF-01.05).
  litellm:
    image: ghcr.io/berriai/litellm-non_root:main-v1.83.14-stable@sha256:5bb1d45eefe9b8bdc8d1b34617b8112d03bfc78fc247bea62d7ebd89918c875c
    command: ["--config", "/run/secrets/litellm_config", "--port", "4000"]
    secrets:
      - litellm_config
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Previsioni dei prezzi con Prophet (docs/architecture.md §10, ADR 0107): immagine propria, solo sulla rete
  # dell'installazione, nessuna porta pubblicata e nessun segreto. Il limite di memoria protegge gli altri servizi della
  # macchina da un addestramento pesante.
  forecaster:
    image: ${FORECASTER_IMAGE:-}
    environment:
      FORECASTER_RETRAIN_MINUTES: "15"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Il worker è l'unico servizio che riceve la chiave privata delle credenziali (ADR 0007, ADR 0021).
  # Nessuna porta pubblicata: lo raggiunge solo l'API sulla rete dell'installazione, con il token generato sulla macchina.
  worker:
    image: ${API_IMAGE:-}
    command: ["autotrading.bootstrap:create_worker_application", "--factory", "--host", "0.0.0.0", "--port", "8000", "--log-config", "/app/logging.json"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-}
      DATABASE_HOST: postgres
      DATABASE_NAME: autotrading
      DATABASE_USER: autotrading_app
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      CREDENTIALS_PRIVATE_KEY_FILE: /run/secrets/credentials_private_key_v1
      CREDENTIALS_KEY_VERSION: "1"
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      # Vuoto finché il proprietario non vi scrive il token del bot: il worker parte con le notifiche disattivate (ADR 0035).
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY_FILE: /run/secrets/litellm_master_key
    secrets:
      - postgres_app_password
      - credentials_private_key_v1
      - worker_token
      - telegram_bot_token
      - litellm_master_key
    read_only: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Senza il proxy fallisce solo la chiamata al modello del ciclo, non il worker.
      litellm:
        condition: service_started

  api:
    image: ${API_IMAGE:-}
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-}
      APP_VERSION: ${APP_VERSION:-}
      DATABASE_HOST: postgres
      DATABASE_NAME: autotrading
      DATABASE_USER: autotrading_app
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      # The API seals account credentials with the public key only; the private key never enters it (ADR 0007).
      CREDENTIALS_PUBLIC_KEY_FILE: /run/secrets/credentials_public_key
      CREDENTIALS_KEY_VERSION: "1"
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_SCOPE: ${AUTH_SCOPE:-}
      WORKER_URL: http://worker:8000
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY_FILE: /run/secrets/litellm_master_key
    secrets:
      - postgres_app_password
      - credentials_public_key
      - worker_token
      - litellm_master_key
    read_only: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
      litellm:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

secrets:
  postgres_owner_password:
    file: ./secrets/postgres_owner_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  credentials_public_key:
    file: ./secrets/credentials_public_key
  credentials_private_key_v1:
    file: ./secrets/credentials_private_key_v1
  worker_token:
    file: ./secrets/worker_token
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  litellm_master_key:
    file: ./secrets/litellm_master_key
  litellm_config:
    file: ./secrets/litellm_config

volumes:
  postgres-data:
