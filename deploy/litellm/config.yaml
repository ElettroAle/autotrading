# Configurazione del proxy LiteLLM (ADR 0101), senza segreti: prepare-installation.sh vi aggiunge sulla macchina la
# chiave master e la monta nel container come file in sola lettura.
#
# Abilitare un fornitore = una rotta qui (e il controllo della sua chiave, ADR 0103); i suoi modelli di chat entrano
# nel catalogo da soli. Nessuna chiave dei fornitori: ogni richiesta del worker porta la chiave
# dell'utente del flusso, valida solo per quella richiesta (RF-01.05, ADR 0029).
model_list:
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
  - model_name: "deepseek/*"
    litellm_params:
      model: "deepseek/*"
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
  # La mappa dei modelli di LiteLLM non descrive OpenRouter: i suoi modelli entrano nel catalogo solo scritti qui,
  # con tipo e massimo di token di risposta (ADR 0103).
  - model_name: "openrouter/deepseek/deepseek-chat"
    litellm_params:
      model: "openrouter/deepseek/deepseek-chat"
    model_info:
      mode: chat
      max_output_tokens: 8192

litellm_settings:
  # Un parametro che il modello non accetta si toglie invece di far fallire il ciclo.
  drop_params: true
  # Né i messaggi né le risposte finiscono nei log del proxy.
  turn_off_message_logging: true

router_settings:
  # Il ciclo successivo è il nuovo tentativo; un tentativo del proxy spenderebbe di nuovo il credito dell'utente.
  num_retries: 0
  # Le rotte sono condivise da tutti i tenant: il rifiuto della chiave di un utente non deve fermare quella degli altri.
  disable_cooldowns: true
