#cloud-config
# Configurazione versionata di una macchina dell'installazione (R0.5.4, ADR 0013).
# I segnaposto con il dollaro sono riempiti da tools/render_cloud_init.py nella pipeline.
# La macchina non accetta connessioni da Internet: si raggiunge solo dal tailnet, con Tailscale SSH e
# Tailscale Serve (HTTPS sul nome autotrading-<ambiente>.<tailnet>.ts.net).
package_update: true
package_upgrade: true
packages:
  - curl
  - docker.io
  - docker-compose-v2
  - ufw
  - unattended-upgrades

groups:
  - docker

users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true

ssh_pwauth: false
disable_root: true

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow in on tailscale0
  - ufw --force enable
  - install -d -o deploy -g deploy -m 750 /opt/autotrading
  - systemctl enable --now docker
  - curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg
  - curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list
  - apt-get update
  - apt-get install -y tailscale
  - tailscale up --auth-key=${TAILSCALE_AUTH_KEY} --hostname=autotrading-${ENVIRONMENT} --advertise-tags=tag:autotrading-${ENVIRONMENT} --ssh
  - tailscale serve --bg --https=443 http://127.0.0.1:8000
  - systemctl disable --now ssh.socket ssh.service
