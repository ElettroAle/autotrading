#cloud-config
# Configurazione versionata di una macchina dell'installazione (R0.5.4).
# I segnaposto con il dollaro sono riempiti da tools/render_cloud_init.py nella pipeline.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - unattended-upgrades

groups:
  - docker

users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${DEPLOY_PUBLIC_KEY}

ssh_pwauth: false
disable_root: true
ssh_deletekeys: true
ssh_genkeytypes: []
# Chiave host nota in anticipo: la pipeline verifica l'identità della macchina invece di
# fidarsi della prima chiave che riceve.
ssh_keys:
  ed25519_private: |
${HOST_PRIVATE_KEY}
  ed25519_public: ${HOST_PUBLIC_KEY}

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - install -d -o deploy -g deploy -m 750 /opt/autotrading
  - systemctl enable --now docker
  - systemctl restart ssh
