name: coverage-gate
description: Soglie di copertura degli unit test (90% domain e application, 80% totale).
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-reports
    - name: Soglie di copertura
      shell: bash
      run: uv run python -m tools.coverage_gate coverage.json
