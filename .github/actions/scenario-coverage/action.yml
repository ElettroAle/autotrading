name: scenario-coverage
description: Ogni scenario di specs/ non marcato @pipeline deve essere superato dal runner del suo sistema.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-reports
    # The scenarios of the dashboard run with Playwright and report beside those of pytest-bdd (ADR 0116).
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dashboard-test-reports
        path: dashboard
    # The report of pytest-bdd first, then that of Playwright: a scenario counts only from the runner of its system
    # (ADR scenari-per-sistema-sotto-la-user-story).
    - name: Copertura degli scenari
      shell: bash
      run: uv run python -m tools.scenario_coverage specs cucumber.json dashboard/reports/cucumber.json
