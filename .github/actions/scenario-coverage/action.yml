name: scenario-coverage
description: Ogni scenario di specs/ non marcato @wip o @pipeline deve essere eseguito e superato.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-reports
    - name: Copertura degli scenari
      shell: bash
      run: uv run python -m tools.scenario_coverage specs cucumber.json
