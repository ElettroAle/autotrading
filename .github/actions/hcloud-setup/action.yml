name: hcloud-setup
description: Installa la CLI hcloud verificata con il checksum della release.
runs:
  using: composite
  steps:
    - name: Installa hcloud
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        HCLOUD_VERSION: 1.70.2
      run: |
        base="https://github.com/hetznercloud/cli/releases/download/v${HCLOUD_VERSION}"
        curl -fsSLO "${base}/hcloud-linux-amd64.tar.gz"
        curl -fsSLO "${base}/checksums.txt"
        grep " hcloud-linux-amd64.tar.gz\$" checksums.txt | sha256sum --check
        tar -xzf hcloud-linux-amd64.tar.gz hcloud
        echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
