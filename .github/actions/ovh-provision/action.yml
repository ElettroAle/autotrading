name: ovh-provision
description: Crea la macchina dell'installazione su OVH Public Cloud da cloud-init versionato; non duplica un'installazione esistente e la porta al tipo d'istanza dichiarato.
inputs:
  environment:
    description: dev o prod
    required: true
  client-id:
    description: Identificativo del service account OVH
    required: true
  client-secret:
    description: Segreto del service account OVH
    required: true
  project-id:
    description: Identificativo del progetto Public Cloud
    required: true
  region:
    description: Regione Public Cloud
    required: true
  zone:
    description: Zona dell'account OVH (eu o ca)
    required: true
  flavor:
    description: Tipo di istanza Public Cloud
    required: true
  tailscale-auth-key:
    description: Chiave Tailscale monouso con cui la macchina entra nel tailnet
    required: true
outputs:
  created:
    description: true se la macchina è stata creata in questa esecuzione
    value: ${{ steps.exists.outputs.created }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/ovh-setup
      with:
        project-id: ${{ inputs.project-id }}
        region: ${{ inputs.region }}
        zone: ${{ inputs.zone }}
    - id: exists
      name: Installazione già esistente?
      shell: bash
      env:
        OS_CLIENT_ID: ${{ inputs.client-id }}
        OS_CLIENT_SECRET: ${{ inputs.client-secret }}
        ENVIRONMENT: ${{ inputs.environment }}
      # A listing fails loudly on authentication errors, unlike a lookup by name. A machine that OVH failed to
      # build is reported and removed, so this run builds it again instead of treating it as existing.
      run: |
        servers="$(openstack server list --name "^autotrading-${ENVIRONMENT}\$" -f value -c ID -c Status)"
        while read -r id status; do
          [ "$status" = "ERROR" ] || continue
          fault="$(openstack server show "$id" -f json -c fault | jq -r '.fault.message // .fault // "nessun dettaglio"')"
          echo "::warning::macchina ${id} in errore da un'esecuzione precedente: ${fault}; la rimuovo"
          openstack server delete --wait "$id"
        done <<< "$servers"
        if grep -v " ERROR$" <<< "$servers" | grep -q .; then
          echo "::notice::installazione ${ENVIRONMENT} già esistente"
          echo "created=false" >> "$GITHUB_OUTPUT"
        else
          echo "created=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Porta la macchina esistente al tipo d'istanza dichiarato
      if: ${{ steps.exists.outputs.created == 'false' }}
      shell: bash
      env:
        OS_CLIENT_ID: ${{ inputs.client-id }}
        OS_CLIENT_SECRET: ${{ inputs.client-secret }}
        ENVIRONMENT: ${{ inputs.environment }}
        FLAVOR: ${{ inputs.flavor }}
      # A resize keeps disk and data and reboots the machine, so it also recovers a machine that stopped answering
      # (ADR 0144). The list shows the flavor name on every compute microversion, unlike the server details.
      run: |
        server="$(openstack server list --name "^autotrading-${ENVIRONMENT}\$" -f value -c ID -c Flavor)"
        read -r id current <<< "$server"
        if [ -z "$current" ]; then
          echo "::error::tipo d'istanza della macchina ${id} non leggibile"
          exit 1
        fi
        if [ "$current" = "$FLAVOR" ]; then
          echo "::notice::installazione ${ENVIRONMENT} già sul tipo d'istanza ${FLAVOR}"
          exit 0
        fi
        echo "::notice::installazione ${ENVIRONMENT} da ${current} a ${FLAVOR}"
        openstack server resize --flavor "$FLAVOR" --wait "$id"
        if [ "$(openstack server show "$id" -f value -c status)" = "VERIFY_RESIZE" ]; then
          openstack server resize confirm "$id"
        fi
        for _ in $(seq 1 60); do
          status="$(openstack server show "$id" -f value -c status)"
          if [ "$status" = "ACTIVE" ] || [ "$status" = "ERROR" ]; then
            break
          fi
          sleep 10
        done
        if [ "$status" != "ACTIVE" ]; then
          fault="$(openstack server show "$id" -f json -c fault | jq -r '.fault.message // .fault // "nessun dettaglio"')"
          echo "::error::OVH non ha ridimensionato la macchina (stato ${status}): ${fault}"
          exit 1
        fi
    - name: Crea la macchina
      if: ${{ steps.exists.outputs.created == 'true' }}
      shell: bash
      env:
        OS_CLIENT_ID: ${{ inputs.client-id }}
        OS_CLIENT_SECRET: ${{ inputs.client-secret }}
        ENVIRONMENT: ${{ inputs.environment }}
        FLAVOR: ${{ inputs.flavor }}
        TAILSCALE_AUTH_KEY: ${{ inputs.tailscale-auth-key }}
      # The project's default security group is used untouched: it lets the machine out and nothing in, which
      # is all Tailscale needs (ADR 0013). No security group or rule is created, changed or deleted. If OVH
      # fails to build the machine, its reason is reported and only that broken machine is removed.
      run: |
        user_data="${RUNNER_TEMP}/cloud-init.yaml"
        umask 077
        uv run python -m tools.render_cloud_init deploy/cloud-init.yaml > "$user_data"
        id="$(openstack server create "autotrading-${ENVIRONMENT}" --flavor "$FLAVOR" --image "Ubuntu 24.04" \
          --network Ext-Net --security-group default --user-data "$user_data" \
          --property app=autotrading --property "environment=${ENVIRONMENT}" -f value -c id)"
        rm -f "$user_data"
        for _ in $(seq 1 60); do
          status="$(openstack server show "$id" -f value -c status)"
          [ "$status" = "BUILD" ] || break
          sleep 10
        done
        if [ "$status" != "ACTIVE" ]; then
          fault="$(openstack server show "$id" -f json -c fault | jq -r '.fault.message // .fault // "nessun dettaglio"')"
          echo "::error::OVH non ha creato la macchina (stato ${status}): ${fault}"
          [ "$status" = "ERROR" ] && openstack server delete --wait "$id"
          exit 1
        fi
