name: installation-start
description: Attende che la macchina entri nel tailnet e finisca cloud-init, copia il compose e verifica il certificato HTTPS.
inputs:
  hostname:
    description: Nome dell'installazione nel tailnet
    required: true
runs:
  using: composite
  steps:
    - name: Attendi la macchina e copia il compose
      shell: bash
      env:
        HOSTNAME_TS: ${{ inputs.hostname }}
      # Tailscale SSH authenticates both ends with their tailnet identity, so no SSH key exists and a host
      # key seen for the first time over the tailnet can be accepted (ADR 0013).
      run: |
        target="deploy@${HOSTNAME_TS}"
        ssh_options=(-o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=${RUNNER_TEMP}/known_hosts"
          -o BatchMode=yes -o ConnectTimeout=5)
        for attempt in $(seq 1 120); do
          ssh "${ssh_options[@]}" "$target" true && break
          sleep 5
        done
        ssh "${ssh_options[@]}" "$target" 'cloud-init status --wait'
        ssh "${ssh_options[@]}" "$target" 'cat > /opt/autotrading/compose.yaml' < deploy/compose.yaml
    - name: Certificato HTTPS valido
      shell: bash
      env:
        HOSTNAME_TS: ${{ inputs.hostname }}
      # Until the first release the API is not running: any HTTP answer over a valid certificate is enough.
      run: |
        for attempt in $(seq 1 36); do
          curl -sS --max-time 10 -o /dev/null "https://${HOSTNAME_TS}/" && exit 0
          sleep 5
        done
        echo "::error::${HOSTNAME_TS} non risponde in HTTPS con un certificato valido"
        exit 1
