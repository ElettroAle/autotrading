name: installation-host
description: Trova la macchina dell'installazione e il suo nome pubblico derivato dall'indirizzo.
inputs:
  environment:
    description: dev o prod
    required: true
  client-id:
    description: Identificativo del service account OVH
    required: true
  client-secret:
    description: Segreto del service account OVH
    required: true
  project-id:
    description: Identificativo del progetto Public Cloud
    required: true
  region:
    description: Regione Public Cloud
    required: true
outputs:
  address:
    description: Indirizzo IPv4 della macchina
    value: ${{ steps.lookup.outputs.address }}
  hostname:
    description: Nome pubblico (sslip.io)
    value: ${{ steps.lookup.outputs.hostname }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/openstack-setup
      with:
        project-id: ${{ inputs.project-id }}
        region: ${{ inputs.region }}
    - id: lookup
      name: Indirizzo dell'installazione
      shell: bash
      env:
        OS_CLIENT_ID: ${{ inputs.client-id }}
        OS_CLIENT_SECRET: ${{ inputs.client-secret }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        address="$(openstack server show "autotrading-${ENVIRONMENT}" -f json -c addresses \
          | jq -r '.addresses["Ext-Net"][] | select(test("^[0-9.]+$"))' | head -n 1)"
        if [ -z "$address" ]; then
          echo "::error::nessun indirizzo IPv4 pubblico per l'installazione ${ENVIRONMENT}"
          exit 1
        fi
        echo "address=${address}" >> "$GITHUB_OUTPUT"
        echo "hostname=${address//./-}.sslip.io" >> "$GITHUB_OUTPUT"
