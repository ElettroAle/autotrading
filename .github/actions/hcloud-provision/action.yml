name: hcloud-provision
description: Crea la macchina dell'installazione da cloud-init versionato; non duplica un'installazione esistente.
inputs:
  environment:
    description: dev o prod
    required: true
  hcloud-token:
    description: Token API Hetzner dell'ambiente
    required: true
  deploy-public-key:
    description: Chiave pubblica dell'utente deploy
    required: true
  host-private-key:
    description: Chiave privata host della macchina
    required: true
  host-public-key:
    description: Chiave pubblica host della macchina
    required: true
  server-type:
    description: Tipo di server Hetzner
    required: true
  location:
    description: Posizione Hetzner
    required: true
outputs:
  created:
    description: true se la macchina è stata creata in questa esecuzione
    value: ${{ steps.exists.outputs.created }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/hcloud-setup
    - id: exists
      name: Installazione già esistente?
      shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if hcloud server describe "autotrading-${ENVIRONMENT}" > /dev/null 2>&1; then
          echo "::notice::installazione ${ENVIRONMENT} già esistente"
          echo "created=false" >> "$GITHUB_OUTPUT"
        else
          echo "created=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Firewall e chiave
      if: ${{ steps.exists.outputs.created == 'true' }}
      shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        ENVIRONMENT: ${{ inputs.environment }}
        DEPLOY_PUBLIC_KEY: ${{ inputs.deploy-public-key }}
      run: |
        firewall="autotrading-${ENVIRONMENT}"
        if ! hcloud firewall describe "$firewall" > /dev/null 2>&1; then
          hcloud firewall create --name "$firewall" --label app=autotrading --label "environment=${ENVIRONMENT}"
          for port in 22 443; do
            hcloud firewall add-rule "$firewall" --direction in --protocol tcp --port "$port" \
              --source-ips 0.0.0.0/0 --source-ips ::/0
          done
        fi
        # Con una chiave registrata Hetzner non genera né invia per email una password di root.
        if ! hcloud ssh-key describe "autotrading-${ENVIRONMENT}-deploy" > /dev/null 2>&1; then
          hcloud ssh-key create --name "autotrading-${ENVIRONMENT}-deploy" --public-key "$DEPLOY_PUBLIC_KEY"
        fi
    - name: Crea la macchina
      if: ${{ steps.exists.outputs.created == 'true' }}
      shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        ENVIRONMENT: ${{ inputs.environment }}
        SERVER_TYPE: ${{ inputs.server-type }}
        LOCATION: ${{ inputs.location }}
        DEPLOY_PUBLIC_KEY: ${{ inputs.deploy-public-key }}
        HOST_PRIVATE_KEY: ${{ inputs.host-private-key }}
        HOST_PUBLIC_KEY: ${{ inputs.host-public-key }}
      run: |
        user_data="${RUNNER_TEMP}/cloud-init.yaml"
        umask 077
        uv run python -m tools.render_cloud_init deploy/cloud-init.yaml > "$user_data"
        hcloud server create --name "autotrading-${ENVIRONMENT}" --type "$SERVER_TYPE" --image ubuntu-24.04 \
          --location "$LOCATION" --ssh-key "autotrading-${ENVIRONMENT}-deploy" --firewall "autotrading-${ENVIRONMENT}" \
          --user-data-from-file "$user_data" --label app=autotrading --label "environment=${ENVIRONMENT}"
        rm -f "$user_data"
