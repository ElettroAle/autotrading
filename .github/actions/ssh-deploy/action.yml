name: ssh-deploy
description: Aggiorna l'installazione via Tailscale SSH all'artefatto indicato per digest.
inputs:
  hostname:
    description: Nome dell'installazione nel tailnet
    required: true
  environment:
    description: dev o prod
    required: true
  version:
    description: Versione dichiarata dall'installazione
    required: true
  image:
    description: Riferimento repository@sha256
    required: true
  registry-token:
    description: Token di sola lettura del registro, valido solo per questa esecuzione
    required: true
  auth-issuer:
    description: Issuer OIDC dell'installazione; vuoto finché la directory non è registrata (ADR 0016)
    required: false
    default: ""
  auth-audience:
    description: Audience dei token accettati
    required: false
    default: ""
  auth-client-id:
    description: Client id della pagina OpenAPI (Authorization Code + PKCE)
    required: false
    default: ""
  auth-scope:
    description: Scope chiesto dalla pagina OpenAPI
    required: false
    default: ""
  telegram-bot-token:
    description: Token del bot Telegram dal segreto dell'environment; vuoto lascia il bot com'è (ADR 0071)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Aggiorna l'installazione
      shell: bash
      env:
        HOSTNAME_TS: ${{ inputs.hostname }}
        APP_ENVIRONMENT: ${{ inputs.environment }}
        APP_VERSION: ${{ inputs.version }}
        API_IMAGE: ${{ inputs.image }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        AUTH_ISSUER: ${{ inputs.auth-issuer }}
        AUTH_AUDIENCE: ${{ inputs.auth-audience }}
        AUTH_CLIENT_ID: ${{ inputs.auth-client-id }}
        AUTH_SCOPE: ${{ inputs.auth-scope }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-bot-token }}
      # Tailscale SSH: identity from the tailnet, no SSH key (ADR 0013).
      run: |
        target="deploy@${HOSTNAME_TS}"
        ssh_options=(-o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=${RUNNER_TEMP}/known_hosts"
          -o BatchMode=yes)
        ssh "${ssh_options[@]}" "$target" 'cat > /opt/autotrading/compose.yaml' < deploy/compose.yaml
        # Public configuration only: issuer, audience, client id and scope are not secrets (ADR 0016).
        {
          printf 'API_IMAGE=%s\nAPP_ENVIRONMENT=%s\nAPP_VERSION=%s\n' "$API_IMAGE" "$APP_ENVIRONMENT" "$APP_VERSION"
          printf 'AUTH_ISSUER=%s\nAUTH_AUDIENCE=%s\n' "$AUTH_ISSUER" "$AUTH_AUDIENCE"
          printf 'AUTH_CLIENT_ID=%s\nAUTH_SCOPE=%s\n' "$AUTH_CLIENT_ID" "$AUTH_SCOPE"
        } | ssh "${ssh_options[@]}" "$target" 'cat > /opt/autotrading/.env'
        # Il token di registro vale solo per questa esecuzione e viene rimosso subito dopo il pull.
        printf '%s' "$REGISTRY_TOKEN" | ssh "${ssh_options[@]}" "$target" \
          "docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin"
        ssh "${ssh_options[@]}" "$target" \
          'cd /opt/autotrading && docker compose pull; status=$?; docker logout ghcr.io; exit $status'
        # The template of the LiteLLM configuration holds no secret: the machine adds the master key (ADR 0101).
        ssh "${ssh_options[@]}" "$target" 'install -d -m 755 /opt/autotrading/litellm           && cat > /opt/autotrading/litellm/config.yaml' < deploy/litellm/config.yaml
        # Service secrets are generated on the machine and never leave it (ADR 0015).
        ssh "${ssh_options[@]}" "$target" 'cat > /opt/autotrading/prepare-installation.sh' \
          < deploy/prepare-installation.sh
        ssh "${ssh_options[@]}" "$target" 'bash /opt/autotrading/prepare-installation.sh' \
          < deploy/postgres/10-application-role.sh
        # The token of the bot is created outside the machine: it travels only inside SSH, on stdin (ADR 0071).
        if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
          ssh "${ssh_options[@]}" "$target" 'cat > /opt/autotrading/install-telegram-token.sh' \
            < deploy/install-telegram-token.sh
          printf '%s' "$TELEGRAM_BOT_TOKEN" | ssh "${ssh_options[@]}" "$target" \
            'bash /opt/autotrading/install-telegram-token.sh'
        fi
        # On failure the container state and logs explain why; lines naming a password are dropped.
        ssh "${ssh_options[@]}" "$target" 'cd /opt/autotrading && docker compose up -d --remove-orphans \
          || { docker compose ps -a; docker compose logs --no-color --tail 60 postgres migrate litellm worker | grep -vi password; exit 1; }'
        # The worker reads the token only when it starts: a changed token recreates the worker alone.
        ssh "${ssh_options[@]}" "$target" 'cd /opt/autotrading && if [ -e .telegram_bot_token_changed ]; then
          docker compose up -d --no-deps --force-recreate worker && rm -f .telegram_bot_token_changed; fi'
        # The proxy reads its configuration only when it starts: a changed configuration recreates the proxy alone.
        ssh "${ssh_options[@]}" "$target" 'cd /opt/autotrading && if [ -e .litellm_config_changed ]; then
          docker compose up -d --no-deps --force-recreate litellm && rm -f .litellm_config_changed; fi'
