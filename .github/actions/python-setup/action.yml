name: python-setup
description: Installa uv e Python 3.15 e sincronizza tutte le dipendenze dal lockfile.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: "3.15"
        enable-cache: true
    - name: Sincronizza le dipendenze
      shell: bash
      run: uv sync --frozen --all-groups
