name: python-setup
description: Installa uv e Python 3.12 e sincronizza tutte le dipendenze dal lockfile.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Sincronizza le dipendenze
      shell: bash
      run: uv sync --frozen --all-groups
