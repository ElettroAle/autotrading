name: sonarcloud-scan
description: Analisi statica su SonarCloud con la copertura degli unit test; il quality gate blocca.
inputs:
  token:
    description: Token SonarCloud
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-reports
    - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: https://sonarcloud.io
