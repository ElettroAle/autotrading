name: sonarcloud-scan
description: Analisi statica su SonarCloud con la copertura degli unit test; il quality gate blocca.
inputs:
  token:
    description: Token SonarCloud
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-reports
    - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: https://sonarcloud.io
