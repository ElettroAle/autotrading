name: provision

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Installazione da creare
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read

jobs:
  provision:
    uses: ./.github/workflows/reusable-provision.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
