# Ispezione in sola lettura del progetto OVH di un'installazione: quote, rete, firewall, risorse.
name: reusable-inspect

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  ispezione:
    name: ispezione ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ovh-inspect
        with:
          client-id: ${{ secrets.OVH_CLIENT_ID }}
          client-secret: ${{ secrets.OVH_CLIENT_SECRET }}
          project-id: ${{ vars.OVH_PROJECT_ID }}
          region: ${{ vars.OVH_REGION || 'GRA11' }}
          zone: ${{ vars.OVH_ZONE || 'eu' }}
