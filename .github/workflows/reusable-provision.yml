# Orchestratore della creazione di un'installazione (R0.5.4, ADR 0013).
name: reusable-provision

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  installazione:
    name: installazione ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - id: key
        uses: ./.github/actions/tailscale-auth-key
        with:
          client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tag: tag:autotrading-${{ inputs.environment }}
      - id: provision
        uses: ./.github/actions/ovh-provision
        with:
          environment: ${{ inputs.environment }}
          client-id: ${{ secrets.OVH_CLIENT_ID }}
          client-secret: ${{ secrets.OVH_CLIENT_SECRET }}
          project-id: ${{ vars.OVH_PROJECT_ID }}
          region: ${{ vars.OVH_REGION || 'SBG5' }}
          zone: ${{ vars.OVH_ZONE || 'eu' }}
          flavor: ${{ vars.OVH_FLAVOR || 'd2-2' }}
          tailscale-auth-key: ${{ steps.key.outputs.key }}
      # Joining the tailnet and starting the installation are repeatable, so a rerun completes a machine that a
      # failed run left half configured.
      - id: tailnet
        uses: ./.github/actions/tailscale-connect
        with:
          client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          environment: ${{ inputs.environment }}
      - uses: ./.github/actions/installation-start
        with:
          hostname: ${{ steps.tailnet.outputs.hostname }}
