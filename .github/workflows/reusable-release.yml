# Orchestratore TrunkFlow (R0.5.2, R0.5.3): un artefatto per integrazione, rilascio
# automatico in dev, promozione dello stesso digest in prod dopo l'approvazione.
# Le installazioni si raggiungono solo dal tailnet, con l'identità OIDC dei job (ADR 0013).
name: reusable-release

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  versione:
    name: versione
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
      - id: version
        uses: ./.github/actions/release-version
        with:
          mode: prerelease

  artefatto:
    name: artefatto
    needs: versione
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      forecaster-image: ${{ steps.publish-forecaster.outputs.image }}
      dashboard-image: ${{ steps.publish-dashboard.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/image-build
        with:
          tag: autotrading:candidate
      - uses: ./.github/actions/trivy-scan
        with:
          image: autotrading:candidate
      - id: publish
        uses: ./.github/actions/ghcr-publish
        with:
          local-image: autotrading:candidate
          version: ${{ needs.versione.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # The forecaster has its own image, published beside the other with the same version (ADR 0107).
      - uses: ./.github/actions/image-build
        with:
          tag: autotrading-forecaster:candidate
          target: forecaster
      - uses: ./.github/actions/trivy-scan
        with:
          image: autotrading-forecaster:candidate
      - id: publish-forecaster
        uses: ./.github/actions/ghcr-publish
        with:
          local-image: autotrading-forecaster:candidate
          version: ${{ needs.versione.outputs.version }}
          variant: forecaster
          token: ${{ secrets.GITHUB_TOKEN }}
      # The dashboard has its own image too, published with the same version (ADR 0117).
      - uses: ./.github/actions/image-build
        with:
          tag: autotrading-dashboard:candidate
          target: dashboard
      - uses: ./.github/actions/trivy-scan
        with:
          image: autotrading-dashboard:candidate
      - id: publish-dashboard
        uses: ./.github/actions/ghcr-publish
        with:
          local-image: autotrading-dashboard:candidate
          version: ${{ needs.versione.outputs.version }}
          variant: dashboard
          token: ${{ secrets.GITHUB_TOKEN }}

  dev:
    name: rilascio dev
    needs: [versione, artefatto]
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The machine follows the declared instance type before every deploy, so a changed OVH_FLAVOR applies at the
      # next release; with the right type this is only a lookup (ADR 0144).
      - uses: ./.github/actions/ovh-resize
        with:
          environment: dev
          client-id: ${{ secrets.OVH_CLIENT_ID }}
          client-secret: ${{ secrets.OVH_CLIENT_SECRET }}
          project-id: ${{ vars.OVH_PROJECT_ID }}
          region: ${{ vars.OVH_REGION || 'SBG5' }}
          zone: ${{ vars.OVH_ZONE || 'eu' }}
          flavor: ${{ vars.OVH_FLAVOR || 'd2-2' }}
      - id: host
        uses: ./.github/actions/tailscale-connect
        with:
          client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          environment: dev
      - uses: ./.github/actions/ssh-deploy
        with:
          hostname: ${{ steps.host.outputs.hostname }}
          environment: dev
          version: ${{ needs.versione.outputs.version }}
          image: ${{ needs.artefatto.outputs.image }}
          forecaster-image: ${{ needs.artefatto.outputs.forecaster-image }}
          dashboard-image: ${{ needs.artefatto.outputs.dashboard-image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          auth-issuer: ${{ vars.AUTH_ISSUER }}
          auth-audience: ${{ vars.AUTH_AUDIENCE }}
          auth-client-id: ${{ vars.AUTH_CLIENT_ID }}
          auth-scope: ${{ vars.AUTH_SCOPE }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - uses: ./.github/actions/health-check
        with:
          hostname: ${{ steps.host.outputs.hostname }}
          environment: dev
          version: ${{ needs.versione.outputs.version }}

  prod:
    name: promozione prod
    needs: [artefatto, dev]
    runs-on: ubuntu-24.04
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
      - id: release
        uses: ./.github/actions/release-version
        with:
          mode: release
      - uses: ./.github/actions/image-promote
        with:
          image: ${{ needs.artefatto.outputs.image }}
          version: ${{ steps.release.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/image-promote
        with:
          image: ${{ needs.artefatto.outputs.forecaster-image }}
          version: ${{ steps.release.outputs.version }}
          variant: forecaster
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/image-promote
        with:
          image: ${{ needs.artefatto.outputs.dashboard-image }}
          version: ${{ steps.release.outputs.version }}
          variant: dashboard
          token: ${{ secrets.GITHUB_TOKEN }}
      # The machine follows the declared instance type before every deploy, so a changed OVH_FLAVOR applies at the
      # next release; with the right type this is only a lookup (ADR 0144).
      - uses: ./.github/actions/ovh-resize
        with:
          environment: prod
          client-id: ${{ secrets.OVH_CLIENT_ID }}
          client-secret: ${{ secrets.OVH_CLIENT_SECRET }}
          project-id: ${{ vars.OVH_PROJECT_ID }}
          region: ${{ vars.OVH_REGION || 'SBG5' }}
          zone: ${{ vars.OVH_ZONE || 'eu' }}
          flavor: ${{ vars.OVH_FLAVOR || 'd2-2' }}
      - id: host
        uses: ./.github/actions/tailscale-connect
        with:
          client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          environment: prod
      - uses: ./.github/actions/ssh-deploy
        with:
          hostname: ${{ steps.host.outputs.hostname }}
          environment: prod
          version: ${{ steps.release.outputs.version }}
          image: ${{ needs.artefatto.outputs.image }}
          forecaster-image: ${{ needs.artefatto.outputs.forecaster-image }}
          dashboard-image: ${{ needs.artefatto.outputs.dashboard-image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          auth-issuer: ${{ vars.AUTH_ISSUER }}
          auth-audience: ${{ vars.AUTH_AUDIENCE }}
          auth-client-id: ${{ vars.AUTH_CLIENT_ID }}
          auth-scope: ${{ vars.AUTH_SCOPE }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - uses: ./.github/actions/health-check
        with:
          hostname: ${{ steps.host.outputs.hostname }}
          environment: prod
          version: ${{ steps.release.outputs.version }}
