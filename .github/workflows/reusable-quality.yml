# Orchestratore dei controlli di qualità (R0.5.1). Un job per controllo: ogni job è un
# controllo obbligatorio del ruleset di main, con il nome che compare nella pull request.
name: reusable-quality

on:
  workflow_call:
    inputs:
      title:
        description: Titolo della pull request
        type: string
        required: true
      body:
        description: Descrizione della pull request
        type: string
        required: false
        default: ""
      author:
        description: Autore della pull request
        type: string
        required: true
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  segreti:
    name: segreti
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gitleaks-scan

  titolo:
    name: titolo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/conventional-title
        with:
          title: ${{ inputs.title }}

  work-item:
    name: work item
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/work-item-link
        with:
          body: ${{ inputs.body }}
          author: ${{ inputs.author }}

  stile:
    name: stile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/ruff-check

  tipi:
    name: tipi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/mypy-check

  architettura:
    name: architettura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/import-contracts

  specifiche:
    name: specifiche
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/gherkin-validate

  test:
    name: test
    runs-on: ubuntu-24.04
    # Integration tests of the SQLAlchemy adapters run against a real PostgreSQL (rule tests.md).
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_ADMIN: postgres
      TEST_DATABASE_ADMIN_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/pytest-run

  copertura-codice:
    name: copertura del codice
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/coverage-gate

  copertura-scenari:
    name: copertura degli scenari
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/scenario-coverage

  vulnerabilita:
    name: vulnerabilità
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-setup
      - uses: ./.github/actions/pip-audit
      - uses: ./.github/actions/image-build
        with:
          tag: autotrading:candidate
      - uses: ./.github/actions/trivy-scan
        with:
          image: autotrading:candidate

  analisi-statica:
    name: analisi statica
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sonarcloud-scan
        with:
          token: ${{ secrets.SONAR_TOKEN }}
