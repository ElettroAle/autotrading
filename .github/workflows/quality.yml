name: quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      title: ${{ github.event.pull_request.title }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
