name: inspect

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Progetto OVH da ispezionare
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read

jobs:
  inspect:
    uses: ./.github/workflows/reusable-inspect.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
