sonar.organization=elettroale
sonar.projectKey=elettroale_autotrading
sonar.sources=src,tools
sonar.tests=tests
sonar.python.version=3.15
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true
# Each AI provider is an integrated system of its own and technology folders never import each other (CLAUDE.md,
# ADR 0106): the four key verifiers repeat the same translation of the answer on purpose.
sonar.cpd.exclusions=src/autotrading/adapters/outbound/*/key_verifier.py
